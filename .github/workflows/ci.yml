name: LexAudit CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Lint + Unit Tests ──────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check backend/ tests/ --select=E,W,F --ignore=E501

      - name: Run unit tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || 'nvapi-test-placeholder' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-placeholder' }}
          CHROMA_PERSIST_PATH: /tmp/chroma_test
          REPORTS_DIR: /tmp/reports_test
          RULES_DIR: ${{ github.workspace }}/rules
          GROUNDING_THRESHOLD: "0.65"
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -v --tb=short \
            --ignore=tests/test_compliance_auditor.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/

  # ── Frontend: Install + Lint + Build ───────────────────────────────────────
  frontend-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ── Docker Compose Build Check ─────────────────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for build
        run: |
          echo "NVIDIA_API_KEY=nvapi-ci-placeholder" > .env
          echo "GEMINI_API_KEY=gemini-ci-placeholder" >> .env

      - name: Build Docker images
        run: docker compose build --no-cache

      - name: Verify images built
        run: docker compose config --services

  # ── E2E Tests (runs only when backend + frontend ready) ────────────────────
  e2e-tests:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY || 'nvapi-test' }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'test' }}" >> .env

      - name: Start services
        run: |
          docker compose up -d
          sleep 20

      - name: Wait for backend health
        run: |
          for i in {1..15}; do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for backend ($i/15)..."
            sleep 5
          done

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          cd e2e
          npm install
          npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: |
          cd e2e
          npx playwright test --reporter=html
        continue-on-error: false

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Stop services
        if: always()
        run: docker compose down
